name: Bump casks on schedule or request

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to livecheck and bump if outdated
        required: false
  schedule:
    # Every 3 hours 23 minutes past the hour
    - cron: "23 */3 * * *"

concurrency:
  group: autobump-${{ inputs.casks && github.run_id || 'scheduled' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autobump:
    if: github.repository == 'open-tap/homebrew-casks'
    env:
      HOMEBREW_DEVELOPER: 1
    runs-on: macos-26
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          core: true
          cask: false

      - name: Configure Git user
        id: git-user-config
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          username: ${{ (github.event_name == 'workflow_dispatch' && github.actor) || 'cask-ci[bot]' }}

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.CASK_CI_APP_ID }}
          private-key: ${{ secrets.CASK_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Bump casks
        id: autobump
        env:
          HOMEBREW_TEST_BOT_AUTOBUMP: 1
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.generate-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git-user-config.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git-user-config.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          CASKS: ${{ inputs.casks }}
        continue-on-error: true
        run: |
          BREW_BUMP=(brew bump --no-fork --open-pr --casks)
          if [[ -n "${CASKS-}" ]]; then
            read -r -a casks <<<"${CASKS//,/ }"
            qualified_casks=()
            for cask in "${casks[@]}"
            do
              if [[ "$cask" == */* ]]; then
                [[ "$cask" == "$TAP_NAME/"* ]] || exit 1
                qualified_casks+=("$cask")
              else
                qualified_casks+=("$TAP_NAME/$cask")
              fi
            done
            "${BREW_BUMP[@]}" "${qualified_casks[@]}"
          else
            # Third-party taps can bump the whole tap without an autobump list.
            "${BREW_BUMP[@]}" --tap="$TAP_NAME"
          fi
