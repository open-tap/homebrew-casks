name: Bump casks on schedule or request

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to bump
        required: false
  schedule:
    # Every 3 hours 23 minutes past the hour
    - cron: "23 */3 * * *"

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Configure Git user
        id: git-user-config
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          username: ${{ (github.event_name == 'workflow_dispatch' && github.actor) || 'cask-ci[bot]' }}

      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CASK_CI_APP_ID }}
          private-key: ${{ secrets.CASK_CI_PRIVATE_KEY }}

      - name: Bump casks
        id: autobump
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.generate-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git-user-config.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git-user-config.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          CASKS: ${{ inputs.casks }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        continue-on-error: true
        run: |
          if [[ -n "${CASKS-}" ]]; then
            for cask in $CASKS; do
              cask="$TAP_NAME/$cask"
              echo "==> Checking latest version for $cask via livecheck ..."
              
              # Run livecheck for this specific cask and only return updates if a newer version exists
              LIVECHECK_JSON=$(brew livecheck "$cask" --newer-only --extract-plist --json 2>/dev/null || echo "[]")
              
              # Extract the latest version from the JSON payload
              LATEST_VERSION=$(echo "$LIVECHECK_JSON" | jq -r '.[] | .version.latest' 2>/dev/null || true)

              # Check if a new version was found
              if [[ -z "${LATEST_VERSION}" ]]; then
                echo "==> $cask is already up-to-date or livecheck failed."
                continue
              fi

              echo "==> New version found! Bumping $cask to version $LATEST_VERSION ..."
              # Bump the cask explicitly providing the version option
              brew bump-cask-pr \
                --no-fork \
                --version="${LATEST_VERSION}" \
                --debug \
                "$cask" || echo "::warning::Bump failed for $cask"
            done
            exit 0
          fi

          echo "==> Checking for outdated casks via livecheck ..."
          OUTDATED_JSON=$(brew livecheck --tap="$TAP_NAME" --newer-only --extract-plist --json 2>/dev/null || echo "[]")
          
          # Extracts "name:version" pairs from the JSON array
          OUTDATED_PAIRS=$(echo "$OUTDATED_JSON" | jq -r '.[] | select(.version.latest != null and .version.latest != "null" and .version.latest != "") | "\(.cask):\(.version.latest)"' | paste -sd " " -)
          
          if [[ -z "${OUTDATED_PAIRS// /}" ]]; then
            echo "No outdated casks found."
            exit 0
          fi
          
          echo "Outdated packages found: $OUTDATED_PAIRS"
          
          for pair in ${OUTDATED_PAIRS}; do
            # Split the string by the colon delimiter
            cask="$TAP_NAME/${pair%%:*}"
            version="${pair##*:}"
            
            echo "==> New version found! Bumping $cask to version $version ..."
            
            # Executing the bump with the extracted version number, force flag, and quota check bypass
            brew bump-cask-pr \
              --no-fork \
              --version="${version}" \
              --debug \
              "$cask" || echo "::warning::Bump failed for $cask"
          done
