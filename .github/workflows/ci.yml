name: CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: macos-26
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    env:
        HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_ACTION_PAT }}
        HOMEBREW_DEVELOPER: 1
        GH_TOKEN: ${{ secrets.GH_ACTION_PAT }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-26-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-26-rubygems-

      # Erases environment state left over from previous actions runner jobs, such as Homebrew caches, downloads, logs, and temporary files. It does not run any tests.
      - run: brew test-bot --only-cleanup-before

      # Installs required Ruby Gems and locks down Homebrew test-bot prerequisites.
      - run: brew test-bot --only-setup

      # Instantly scans your entire Casks/ directory for syntax, token errors, and layout mistakes.
      - run: brew test-bot --only-tap-syntax

      # Triggers only during PRs to download, verify hashes, and live-test your brand-new or updated cask files.
      - run: brew test-bot --only-formulae
        if: ${{ github.event_name == 'pull_request' }}
