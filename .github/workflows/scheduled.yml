name: Scheduled online check
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scheduled.yml
  schedule:
    # Once every day at 1AM
    - cron: "0 1 * * *"

concurrency:
  group: scheduled
  cancel-in-progress: true

jobs:
  create_matrix:
    if: github.repository == 'open-tap/homebrew-casks'
    runs-on: macos-latest
    outputs:
      json: ${{ steps.matrix.outputs.json }}
    env:
      TEST_COUNT: 50
      TAP: open-tap/casks
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false

      - run: brew install coreutils

      - name: Generate matrix
        id: matrix
        run: |
          casks="$(find "$(brew --repo "${TAP}")/Casks" -type f | shuf -n "${TEST_COUNT}" | xargs -I{} basename {} .rb | sed "s|^|${TAP}/|")"
          # shellcheck disable=SC2086
          json="$(
            brew info --json=v2 --casks $casks |
            jq --compact-output '[.casks[] | select(.deprecated == false and .disabled == false) | .full_token]'
          )"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

  audit_online:
    if: needs.create_matrix.outputs.json != '[]'
    runs-on: ${{ matrix.os }}
    needs: create_matrix
    name: "Online check (${{ matrix.os }}): ${{ matrix.cask }}"
    env:
      HOMEBREW_DEVELOPER: 1
      CASK: ${{ matrix.cask }}
      HOMEBREW_GITHUB_API_TOKEN: "${{ github.token }}"
      GH_TOKEN: "${{ github.token }}"
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: read
      issues: write # To create issues
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJson(needs.create_matrix.outputs.json) }}
        os: [macos-latest]
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false

      - name: Check cask source is not archived
        id: archived
        run: brew audit --cask --online --skip-style --only github_repository_archived,gitlab_repository_archived "$CASK"

      - name: Check cask homepage
        id: homepage
        if: ${{ !cancelled() }}
        run: brew audit --cask --online --skip-style --only homepage "$CASK"

      - name: Check cask download
        id: fetch
        if: ${{ !cancelled() }}
        run: brew fetch --cask "$CASK"

      - name: Report online check failures
        if: >-
          !cancelled() &&
          (steps.archived.outcome == 'failure' || steps.homepage.outcome == 'failure' || steps.fetch.outcome == 'failure')
        uses: Homebrew/actions/create-or-update-issue@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          title: "Scheduled online check: ${{ matrix.cask }}"
          body: |
            Online checks failed for `${{ matrix.cask }}`.

            - Repository: ${{ steps.archived.outcome }}
            - Homepage: ${{ steps.homepage.outcome }}
            - Download: ${{ steps.fetch.outcome }}

            [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          update-existing: true
          skip-if-unchanged: true
