name: Scheduled online check

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scheduled.yml
  schedule:
    # Once every day at 1AM
    - cron: "0 1 * * *"

concurrency:
  group: scheduled
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  create_matrix:
    runs-on: macos-26
    outputs:
      json: ${{ steps.matrix.outputs.json }}
    env:
      TEST_COUNT: 50
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - run: brew install coreutils

      - name: Generate matrix
        id: matrix
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          casks=$(find "$(brew --repo $TAP_NAME)/Casks" -type f | shuf -n $TEST_COUNT | xargs -I{} sh -c 'echo $TAP_NAME/$(basename {} .rb)')
          json="$(
            echo $casks | xargs brew info --json=v2 --casks |
            jq --compact-output '[.casks[] | select(.deprecated == false and .disabled == false) | .full_token]'
          )"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

  audit_online:
    runs-on: ${{ matrix.os }}
    needs: create_matrix
    name: "Online check (${{ matrix.os }}): ${{ matrix.cask }}"
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_GITHUB_API_TOKEN: "${{ secrets.GH_ACTION_PAT }}"
      CASK: ${{ matrix.cask }}
      GH_TOKEN: "${{ secrets.GH_ACTION_PAT }}"
    permissions:
      issues: write # To create issues
    strategy:
      fail-fast: false
      matrix:
        cask: ${{ fromJson(needs.create_matrix.outputs.json) }}
        os: [macos-26]
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false

      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CASK_CI_APP_ID }}
          private-key: ${{ secrets.CASK_CI_PRIVATE_KEY }}

      - name: Check cask source is not archived.
        id: archived
        run: brew audit --cask --online --skip-style --only github_repository_archived,gitlab_repository_archived "$CASK"

      - name: Report online issues
        if: ${{ failure() && steps.archived.conclusion == 'failure' }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: "${{ steps.generate-token.outputs.token }}"
          GH_TOKEN: "${{ steps.generate-token.outputs.token }}"
        run: |
          gh issue create \
            --repo $GITHUB_REPOSITORY \
            --title "$CASK should be archived." \
            --body "$CASK should be archived. Check $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Check cask for unavailable homepage.
        id: homepage
        run: brew audit --cask --online --skip-style --only homepage "$CASK"

      - name: Report homepage issues
        if: ${{ failure() && steps.homepage.conclusion == 'failure' }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: "${{ steps.generate-token.outputs.token }}"
          GH_TOKEN: "${{ steps.generate-token.outputs.token }}"
        run:  |
          gh issue create \
            --repo $GITHUB_REPOSITORY \
            --title "$CASK has homepage issues." \
            --body "$CASK has homepage issues. Check $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Check cask for missing sources.
        id: fetch
        run: brew fetch --cask "$CASK"

      - name: Report fetch issues
        if: ${{ failure() && steps.fetch.conclusion == 'failure' }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: "${{ steps.generate-token.outputs.token }}"
          GH_TOKEN: "${{ steps.generate-token.outputs.token }}"
        run:  |
          gh issue create \
            --repo $GITHUB_REPOSITORY \
            --title "$CASK source has problems." \
            --body "$CASK source has problems. Check $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
