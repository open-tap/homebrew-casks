# Applies descriptive labels to pull request, and correct its target branch.
name: Triage tasks

on: pull_request_target

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: "triage-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CASK_CI_APP_ID }}
          private-key: ${{ secrets.CASK_CI_PRIVATE_KEY }}

      - name: Set Github app token
        run: echo "GH_TOKEN=${{ steps.generate-token.outputs.token }}" >> $GITHUB_ENV

      - name: Label pull request
        uses: Homebrew/actions/label-pull-requests@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        if: ${{ always() }}
        with:
          token: ${{ steps.generate-token.outputs.token }}
          def: |
            - label: cask deprecated
              path: Casks/.+
              content: \n  deprecate!.*\n

            - label: cask disabled
              path: Casks/.+
              content: \n  disable!.*\n

            - label: new cask
              status: added
              path: Casks/.+
              allow_any_match: true

            - label: marked for removal/rejection
              status: removed
              path: Casks/.+

            - label: documentation
              path: (.*\.md|\.github/ISSUE_TEMPLATE/.*\.yml)

            - label: bump-cask-pr
              pr_body_content: Created with `brew bump-cask-pr`

            - label: missing description
              path: Casks/.+
              missing_content:
                - \n  desc .+\n
                - cask "font-

            - label: extract_plist livecheck
              path: Casks/.+
              content: strategy :extract_plist

            - label: missing zap
              path: Casks/.+
              missing_content: zap .+\n

            - label: linux cask
              path: Casks/.+
              content: ((x86_64|arm64|on)_linux|depends_on :linux)

  check-base-branch:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: >
      always() && 
      github.actor != github.repository_owner &&
      github.actor != 'github-actions[bot]' && 
      github.actor != 'dependabot[bot]' &&
      github.actor != 'cask-ci[bot]'
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ secrets.GH_ACTION_PAT }}
      PR: ${{ github.event.number }}
    steps:
      - name: Check pull request base branch
        id: base
        run: |
          branch="$(
            gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '.base.ref'
          )"
          echo "branch=${branch}" >>"${GITHUB_OUTPUT}"

      - name: Change base branch to `main`
        id: change
        if: steps.base.outputs.branch == 'master'
        run: gh pr edit "${PR}" --base main --repo "${GITHUB_REPOSITORY}"

      - name: Post comment
        if: steps.base.outputs.branch == 'master'
        env:
          BODY: |-
            > [!TIP]
            > This pull request targets the `master` branch. For future pull requests, please target the `main` branch instead.
        run: gh pr comment "${PR}" --body "${BODY}" --repo "${GITHUB_REPOSITORY}"

      - name: Post failure comment
        if: failure() && steps.change.conclusion == 'failure'
        env:
          BODY: |-
            > [!CAUTION]
            > Failed to change base branch to `main`. Please edit your pull request manually to target the `main` branch instead of the `master` branch.
        run: gh pr comment "${PR}" --body "${BODY}" --repo "${GITHUB_REPOSITORY}"
